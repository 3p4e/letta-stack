<title>CoX Quality Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Roboto+Mono:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* CoX shared design system — ImB SPC (DS-QCSP001 v.01), tokens carried verbatim
   from cox.css so this instrument reads as one family with the CoQ and the SPC. */
:root{
  --navy:#1B3A5C; --navy-deep:#0F2540; --navy-mid:#2C5282; --navy-soft:#3B6BA5; --navy-title:#16324F;
  --gold:#A67C2E; --gold-bright:#C9A227; --gold-deep:#7A5C1E; --gold-tint:#FDFBF4;
  --gold-label:#A8873A; --gold-dark:#8F6A1C; --cream:#F9F4E7; --sec-no:#8A5E12;
  --heaven:#F2F5F9; --surface:#FCFDFE; --ground:#B1BAC5;
  --ink:#0F172A; --text:#1E293B; --text-sec:#475569; --text-ter:#8C9BB0; --mkc:#4E5E74;
  --border:#E4EAF1; --border-light:#F1F5F9; --rule:#9EACBA;
  --green:#15803D; --green-soft:#EDF6F0;
  --fail:#9B2C2C; --fail-soft:#F9DEDB; --warn:#8A5E12; --warn-soft:#FAEDD4;
  --info:#2C5282; --info-soft:#EAF0F8;
  --d:'Orbitron',sans-serif; --b:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --m:'Roboto Mono',ui-monospace,monospace;
  --wash:linear-gradient(320deg,#D7E3F0 0%,#E2EBF4 14%,#EEF3F8 28%,#F7F9FB 42%,#FBF9F2 56%,#FAF4E6 72%,#F7EED8 86%,#F4EBD4 100%);
  --metal:linear-gradient(180deg,#ACBFD2 0%,#ACBFD2 1.4%,#DAE5EE 4.5%,#FAFCFE 9%,#F6FAFD 18%,#F6FAFD 28%,#F0F5FA 39%,#E9F0F7 50%,#E1EAF2 61%,#DAE5EE 72%,#D5E1EC 82%,#D9E3EE 92%,#E0E9F1 100%);
  --goldrule:linear-gradient(90deg,rgba(198,185,159,0) 0%,rgba(198,185,159,.33) 12%,rgba(198,185,159,.7) 32%,#C6B99F 50%,rgba(198,185,159,.7) 68%,rgba(198,185,159,.33) 88%,rgba(198,185,159,0) 100%);
}

/* ---------- dark ----------
   Declared twice on purpose. The media block carries the automatic case and is
   guarded with :not([data-theme="light"]) so an explicit light choice beats a
   dark OS; the attribute block carries the manual choice so the toggle wins in
   the other direction. Token names never change - only their values - so every
   component keeps reading through the same variables. The grounds invert to
   near-black navy, the papers become warm dark surfaces, and gold brightens:
   at these luminances the print gold reads as brown. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#8FB4DA; --navy-deep:#C3D8EE; --navy-mid:#7FA7D2; --navy-soft:#6E93BC; --navy-title:#BFD5EA;
  --gold:#D9B45C; --gold-bright:#E8C86E; --gold-deep:#C9A227; --gold-tint:#1E1B14;
  --gold-label:#C9A85A; --gold-dark:#B08A2E; --cream:#221F17; --sec-no:#D9B45C;
  --heaven:#161C25; --surface:#131820; --ground:#080B10;
  --ink:#EEF2F7; --text:#DDE4EC; --text-sec:#A6B2C1; --text-ter:#778393; --mkc:#9AA9BC;
  --border:#26303D; --border-light:#1C242F; --rule:#3A4757;
  --green:#5CBF90; --green-soft:#122A20;
  --fail:#E5786F; --fail-soft:#2E1918; --warn:#D9A441; --warn-soft:#2B2211;
  --info:#7FA7D2; --info-soft:#152131;
  --wash:linear-gradient(320deg,#121A24 0%,#141C27 14%,#161E29 28%,#18202B 42%,#1B1E24 56%,#1E1E1E 72%,#221F18 86%,#251F14 100%);
  --metal:linear-gradient(180deg,#2A3442 0%,#2A3442 1.4%,#222B37 4.5%,#1B222C 9%,#1A212B 18%,#1A212B 28%,#181F28 39%,#161C25 50%,#141A22 61%,#131820 72%,#121720 82%,#141A22 92%,#161C25 100%);
  --goldrule:linear-gradient(90deg,rgba(201,162,39,0) 0%,rgba(201,162,39,.22) 12%,rgba(201,162,39,.5) 32%,#C9A227 50%,rgba(201,162,39,.5) 68%,rgba(201,162,39,.22) 88%,rgba(201,162,39,0) 100%);
}}
:root[data-theme="dark"]{
  --navy:#8FB4DA; --navy-deep:#C3D8EE; --navy-mid:#7FA7D2; --navy-soft:#6E93BC; --navy-title:#BFD5EA;
  --gold:#D9B45C; --gold-bright:#E8C86E; --gold-deep:#C9A227; --gold-tint:#1E1B14;
  --gold-label:#C9A85A; --gold-dark:#B08A2E; --cream:#221F17; --sec-no:#D9B45C;
  --heaven:#161C25; --surface:#131820; --ground:#080B10;
  --ink:#EEF2F7; --text:#DDE4EC; --text-sec:#A6B2C1; --text-ter:#778393; --mkc:#9AA9BC;
  --border:#26303D; --border-light:#1C242F; --rule:#3A4757;
  --green:#5CBF90; --green-soft:#122A20;
  --fail:#E5786F; --fail-soft:#2E1918; --warn:#D9A441; --warn-soft:#2B2211;
  --info:#7FA7D2; --info-soft:#152131;
  --wash:linear-gradient(320deg,#121A24 0%,#141C27 14%,#161E29 28%,#18202B 42%,#1B1E24 56%,#1E1E1E 72%,#221F18 86%,#251F14 100%);
  --metal:linear-gradient(180deg,#2A3442 0%,#2A3442 1.4%,#222B37 4.5%,#1B222C 9%,#1A212B 18%,#1A212B 28%,#181F28 39%,#161C25 50%,#141A22 61%,#131820 72%,#121720 82%,#141A22 92%,#161C25 100%);
  --goldrule:linear-gradient(90deg,rgba(201,162,39,0) 0%,rgba(201,162,39,.22) 12%,rgba(201,162,39,.5) 32%,#C9A227 50%,rgba(201,162,39,.5) 68%,rgba(201,162,39,.22) 88%,rgba(201,162,39,0) 100%);
}

*{box-sizing:border-box}
body{font-family:var(--b);background:var(--ground);color:var(--text);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.sheet{max-width:1400px;margin:0 auto;background:var(--surface);min-height:100vh;
  box-shadow:0 8px 60px rgba(99,113,131,.25);display:flex;flex-direction:column}
a{color:var(--navy-mid);text-decoration:none}
a:hover{color:var(--gold-deep);text-decoration:underline;text-underline-offset:2px}
.mk{font-family:var(--b);font-style:italic;font-weight:500;color:var(--mkc)}

/* ---------- theme toggle ---------- */
.thm{position:absolute;top:10px;right:12px;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--d);font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--navy);background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:5px 11px;cursor:pointer;z-index:5}
.thm:hover{border-color:var(--gold);color:var(--gold-deep)}
.thm .hd{width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;
  background:linear-gradient(90deg,currentColor 0 50%,transparent 50% 100%)}

/* ---------- header ---------- */
.header{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;
  padding:26px 28px 20px;background:var(--wash)}
.h-title{font-family:var(--d);font-size:24px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--navy-title);line-height:1.12}
.h-mk{font-size:9.5px;font-style:italic;color:#5A7391;letter-spacing:2px;
  text-transform:uppercase;margin-top:4px}
.h-sub{font-size:11.5px;font-weight:500;letter-spacing:.1px;
  color:#46617F;margin-top:10px;padding-top:8px;border-top:1px solid rgba(189,174,143,.5);
  max-width:74ch;line-height:1.55}
.h-sub b{font-weight:700;color:var(--navy-title)}
.h-right{text-align:right}
.h-lbl{font-family:var(--d);font-size:7.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--gold-label);margin-bottom:3px}
.h-code{font-family:var(--d);font-size:13px;font-weight:700;color:var(--gold-deep);white-space:nowrap}
.h-issue{font-size:9px;color:#5A7391;margin-top:7px;padding-top:5px;
  border-top:1px solid rgba(189,174,143,.5)}
.h-issue b{font-family:var(--m);font-weight:700;color:var(--navy);font-size:10px}
.goldrule{height:2px;background:var(--goldrule);flex:0 0 auto}

/* ---------- metallic section band ---------- */
.band{display:flex;align-items:center;gap:9px;padding:6px 28px;min-height:26px;
  font-family:var(--d);font-size:10.6px;font-weight:800;letter-spacing:.2px;
  text-transform:uppercase;color:#173654;background-image:var(--metal);
  box-shadow:inset 0 1px 0 rgba(250,253,255,.95),inset 0 -1px 0 rgba(96,134,172,.55)}
.band .no{font-family:var(--m);font-size:13.4px;font-weight:700;color:var(--sec-no)}
.band .mk{font-size:8.2px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:#123A63;font-style:normal}
.band .mk::before{content:" | ";color:#8C9BB0}
.band .tail{margin-left:auto;font-family:var(--m);font-size:9.5px;font-weight:600;
  letter-spacing:0;text-transform:none;color:#3B5A78}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:0;padding:0 28px;background:var(--surface);
  border-bottom:2px solid var(--rule);overflow-x:auto}
.tab{font-family:var(--d);font-size:9.6px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--text-ter);background:none;border:0;
  border-bottom:3px solid transparent;padding:13px 17px 10px;cursor:pointer;
  white-space:nowrap;transition:color .12s,border-color .12s}
.tab:hover{color:var(--navy-mid)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold-deep)}
.tab .n{font-family:var(--m);font-size:10px;font-weight:700;color:var(--gold-deep);
  margin-left:6px;letter-spacing:0}
.tab[aria-selected="true"] .n{color:var(--gold-dark)}

/* ---------- overview ---------- */
.pad{padding:20px 28px 26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:11px}
.kpi{background:var(--surface);border:1px solid var(--border);
  border-top:2.5px solid var(--gold-deep);padding:11px 13px 12px}
.kpi.q{border-top-color:var(--navy-soft)}
.kpi .k{font-family:var(--d);font-size:7.6px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--gold-deep);display:block}
.kpi.q .k{color:var(--navy-soft)}
.kpi .v{font-family:var(--m);font-size:26px;font-weight:700;color:var(--navy);
  line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:10.5px;color:var(--text-sec);line-height:1.36;margin-top:4px}
.kpi .d b{color:var(--navy)}
.split{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.sp{font-family:var(--m);font-size:9.5px;color:var(--text-sec);
  background:var(--heaven);border:1px solid var(--border);border-radius:2px;padding:1.5px 6px}
.sp b{color:var(--navy);font-weight:700}

/* ---------- prose ---------- */
.note{font-size:11.8px;line-height:1.62;color:var(--text-sec);max-width:96ch;
  margin-top:15px}
.note + .note{margin-top:9px}
.note b{color:var(--navy);font-weight:600}
.note code{font-family:var(--m);font-size:10.8px;background:var(--gold-tint);
  border:1px solid #F1EAD4;border-radius:2px;padding:.5px 4px;color:var(--gold-deep)}
.nt{font-family:var(--d);font-size:8px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--gold-label);margin:20px 0 6px}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:14px 28px 12px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.search{flex:1 1 250px;min-width:190px;font-family:var(--m);font-size:12px;
  padding:7px 11px;border:1px solid var(--rule);border-radius:2px;background:#FFF;
  color:var(--ink)}
.search:focus{outline:2px solid var(--navy-soft);outline-offset:-1px;border-color:var(--navy-soft)}
.chip{font-family:var(--b);font-size:10.5px;font-weight:600;letter-spacing:.2px;
  color:var(--text-sec);background:#FFF;border:1px solid var(--border);
  border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap;
  transition:all .12s}
.chip:hover{border-color:var(--rule);color:var(--navy)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#7E96AC 0%,#71889F 42%,#647A90 58%,#5D7185 100%);
  border-color:#5D7185;color:#FFF;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 1px rgba(9,22,38,.5),0 1.5px 2.5px rgba(21,46,74,.35);
  text-shadow:0 1px 1px rgba(9,22,38,.45)}
.chip .c{font-family:var(--m);font-size:9.5px;opacity:.72;margin-left:5px}
.chip.warn[aria-pressed="true"]{background:linear-gradient(180deg,#B08A3C,#8F6A1C);border-color:#8F6A1C}
.chip.fail[aria-pressed="true"]{background:linear-gradient(180deg,#B04A44,#9B2C2C);border-color:#9B2C2C}
.clear{font-size:11px;color:var(--navy-mid);background:none;border:0;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:2px}
.count{font-family:var(--m);font-size:10.5px;color:var(--text-ter);margin-left:auto;
  white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11.6px}
thead th{font-family:var(--b);font-size:8.4px;font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--navy);background:var(--heaven);
  border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);
  padding:6px 9px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th .mk{display:block;font-size:7px;font-weight:500;text-transform:none;
  letter-spacing:.1px;font-style:italic}
tbody td{padding:5px 9px;vertical-align:top;border-bottom:1px solid var(--border-light)}
tbody tr:nth-of-type(even){background:#F7F9FC}
tbody tr.sel{background:var(--gold-tint)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--info-soft)}
.c{text-align:center}.r{text-align:right}
.mono{font-family:var(--m);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.num{font-family:var(--m);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.dim{color:var(--text-ter)}
.nm{font-weight:700;color:var(--navy-title);display:block;line-height:1.18}
.sub{display:block;font-size:9.6px;color:var(--text-sec);line-height:1.24}
.sub.mk{font-style:italic}

/* ---------- status pills & tags ---------- */
.pill{display:inline-block;font-family:var(--b);font-size:9.4px;font-weight:600;
  letter-spacing:.1px;border-radius:2px;padding:1.5px 6px;white-space:normal;
  border:1px solid transparent;line-height:1.3}
.p-ok{background:var(--green-soft);color:var(--green);border-color:#CDE5D6}
.p-fail{background:var(--fail-soft);color:var(--fail);border-color:#EFC7C2;font-weight:700}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:#E8D5AC}
.p-info{background:var(--info-soft);color:var(--info);border-color:#CFDDEF}
.p-none{background:var(--heaven);color:var(--text-ter);border-color:var(--border)}
.src{display:inline-block;font-family:var(--d);font-size:7.4px;font-weight:800;
  letter-spacing:.5px;color:#FFF;border-radius:2px;padding:2px 6px;
  background:linear-gradient(180deg,#9FB3C4,#8D9DAE);
  box-shadow:0 1px 1.5px rgba(21,46,74,.3)}
.src.q{background:linear-gradient(180deg,#DCC897,#BDAE8F);color:#3B2E10}
.grade{display:inline-block;font-family:var(--d);font-size:8.6px;font-weight:800;
  letter-spacing:.8px;text-transform:uppercase;color:#FFF;border-radius:9px;
  padding:2px 9px;background:linear-gradient(180deg,#9FB3C4 0%,#95A7BA 42%,#8D9DAE 58%,#8A97A5 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 1px rgba(9,22,38,.5),0 1.5px 2.5px rgba(21,46,74,.35);
  text-shadow:0 1px 1px rgba(9,22,38,.45)}
.tag{display:inline-block;font-family:var(--b);font-size:8.8px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;border-radius:2px;padding:1.5px 6px;
  border:1px solid;margin-right:4px}
.t-issued{color:var(--gold-deep);border-color:#E0D2AE;background:var(--gold-tint)}
.t-pred{color:var(--navy-soft);border-color:#CFDDEF;background:var(--info-soft)}

/* ---------- CoQ detail ---------- */
.detail{border:1px solid var(--rule);border-top:3px solid var(--gold-deep);
  background:#FFF;margin:0 28px 18px}
.d-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;
  padding:13px 16px 11px;background:linear-gradient(180deg,#F2F5F9 0%,#F9FBFD 55%,#FFF 100%)}
.d-name{font-family:var(--d);font-size:19px;font-weight:700;color:var(--navy);
  letter-spacing:.3px;line-height:1.15}
.d-pot{font-family:var(--d);font-size:19px;font-weight:700;color:var(--gold-deep);
  margin-left:11px}
.d-meta{display:flex;flex-wrap:wrap;gap:5px 18px;margin-top:9px}
.lk{display:flex;flex-direction:column;gap:1px}
.lk .l{font-family:var(--d);font-size:7.6px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--gold-deep)}
.lk .v{font-family:var(--m);font-size:10.6px;font-weight:700;color:var(--navy);white-space:nowrap}
.close{font-family:var(--b);font-size:10.5px;font-weight:600;color:var(--text-sec);
  background:#FFF;border:1px solid var(--border);border-radius:2px;padding:4px 10px;cursor:pointer}
.close:hover{border-color:var(--rule);color:var(--navy)}
.d-note{font-size:10.8px;line-height:1.5;color:var(--text-sec);padding:9px 16px;
  background:var(--gold-tint);border-top:1px solid #F1EAD4;border-bottom:1px solid #F1EAD4}
.d-note b{color:var(--navy)}
tr.grp td{background:var(--gold-tint)!important;font-family:var(--d);font-size:8.4px;
  font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold-deep);
  padding:4px 9px}

/* ---------- misc ---------- */
.empty{padding:40px 28px;text-align:center;color:var(--text-ter);font-size:12.5px}
.foot{margin-top:auto;padding:16px 28px 20px;background:var(--wash);
  border-top:2px solid #ACBFD2;box-shadow:inset 0 1px 0 #FBFDFF;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:9.6px;color:#5A7391;line-height:1.5}
.foot .fr{font-family:var(--d);font-weight:700;font-size:9.5px;text-align:right;color:#5A7391}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--navy-soft);outline-offset:2px}
@media (max-width:820px){
  .header{grid-template-columns:1fr}.h-right{text-align:left}
  .pad,.controls,.band,.tabs{padding-left:16px;padding-right:16px}
  .detail{margin-left:16px;margin-right:16px}
  .d-head{grid-template-columns:1fr}
}
</style>
<style>
/* ---------- release-register batch cards ---------- */
.bcards{display:flex;flex-direction:column;gap:10px;padding:16px 28px 24px}
.bcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--rule)}
.bcard.oos{border-left-color:var(--fail)}
.bcard.warned{border-left-color:var(--gold)}
.bc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding:9px 14px;
  cursor:pointer;background:linear-gradient(180deg,#FCFDFE,#F7F9FC)}
.bc-head:hover{background:var(--info-soft)}
.bc-name{font-family:var(--d);font-size:14px;font-weight:700;color:var(--navy)}
.bc-strain{font-size:11.5px;color:var(--text-sec)}
.bc-pn{font-family:var(--m);font-size:10.5px;color:var(--text-ter)}
.bc-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bc-body{border-top:1px solid var(--border)}
.vchip{display:inline-block;font-family:var(--m);font-size:10px;border:1px solid var(--border);
  border-radius:2px;padding:1.5px 6px;margin:1.5px 2px 1.5px 0;background:#FFF;white-space:nowrap;
  color:var(--text)}
.vchip.pv{background:#EAF4EE;border-color:#BFDCCB}
.vchip.cv{background:#FDF6E7;border-color:#E3CC96;border-style:dashed}
.vchip.more{background:transparent;border-style:dashed;color:var(--text-ter);cursor:help}
/* coverage strip: five bars, one per test family, filled where a certificate exists */
.cov{display:inline-flex;align-items:center;gap:2px;margin-right:8px;cursor:help}
.cov i{width:16px;height:6px;border-radius:1px;background:var(--border);
