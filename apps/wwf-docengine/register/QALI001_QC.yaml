# Register of controlled documents — Quality Control department.
# Source: QALI 001 v01 "Мастер листа на QMS документи / Master list of QMS documents" (Drive file
# 1r7VmPooExht7vGP4s-xaH0nnaZ1MKhhS, read 18.10.2026). Head of QC, 18.10.2026: QALI 001 is the master;
# QAT 001 (SOPs), QAT 002 (WIs) and QAT 003 (forms, logbooks) are views of it.
#
# Changing a row is a controlled change: edit it here and merge it through a reviewed pull request.
# status:
#   effective           approved and in use
#   effective_revising  in use; the next version is being written (QALI note "под ревизија", "се чека нова верзија")
#   awaiting_signature  QA reviewed, not yet signed — not in use
#   draft               being written — not in use
#   superseded          replaced by `replaced_by`
#   withdrawn           removed from the system; the number is never reused
# Codes are in house form (normalised by app/house_codes.py). Titles are QALI 001's.
department: QC
review_years: 3

# Where QAT 001–003 disagree with QALI 001. QALI 001 is used below; each item waits for the Head of QC.
conflicts:
  - "QCSOP010: QAT 001 lists v01 effective 10.02.2025; QALI 001 lists v02 effective 13.02.2026 (used)."
  - "QCSOP004: QAT 001 effective 18.02.2025; QALI 001 v02 effective 01.08.2025 (used)."
  - "QCSOP012: QAT 001 lists v02 effective 14.10.2025; QALI 001 lists v03 awaiting signature. v02 is taken as the version in use."
  - "QCPL001/QCPL002: QAT 003 has QCPL001 = microbiological monitoring plan (08.10.2025); QALI 001 has QCPL001 = hygiene plan and QCPL002 = monitoring plan (used)."
  - "QCT011: QAT 003 lists it effective; QALI 001 says replaced (QALI note names QCSP003, the QALI QCSP002 row says QCSP002 replaces QCT011 — two different replacements)."
  - "QCSOP018: QAT 001 gives revision period 15.08.2025, the same as the effective date (2028 intended)."
  - "QCWI013: QAT 002 gives revision period 22.05.2025, the same as the effective date (2028 intended)."
  - "QCSPW004/QCSPW005: the Macedonian and English names are swapped (PW / TR) in both lists."
  - "QCSOP011A01: QALI 001 writes the annex letter in Cyrillic (\"QCSOP011А01\")."
  - "QCLB006/QCLB007: QAT 003 effective 22.04.2025; QALI 001 10.03.2025 (used)."
  - "QCT007, QCT014, QCT015: listed in QAT 003 as empty numbers (\"PRAZNO\"); not in QALI 001. Not reused."
  - "Two QALI 001 rows have no code: \"План за мострирање на влезни материјали\" and \"План за микробиолошки мониторинг во оддел Култивација\" (draft)."

