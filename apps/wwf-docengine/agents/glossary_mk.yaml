# House Macedonian glossary — approved by the Head of QC on 11.10.2026; траса, уред за ладење/греење and
# ID на логерот added on 13.10.2026; контра мостри (counter samples) on 13.10.2026.
# Source: WHSOP_003 v01 §5.1 Definitions and §5.2 Abbreviations, its annexes, and the
# Head of QC's standing wording rules. Every DocEngine agent clone carries it as the
# gf_glossary_mk memory block (fleet.py); the section linter flags the `lint` patterns
# (glossary.py) so a wrong variant is repaired before the §6A audit sees it.
#
# `lint` holds only variants that are wrong in EVERY context. Terms whose wrong form is
# right elsewhere (вреќа is correct for a waste sack, усогласено for "aligned with") are
# left to the authors and the audit.

source: "WHSOP_003 v01 §5.1–5.2 and the Head of QC's wording rules (approved 11.10.2026)"

terms:
  - {en: "Narcotic drug", mk: "опојна дрога",
     avoid: "еуфорична супстанција (named only where a definition points to older documents)"}
  - {en: "Law on Control of Narcotic Drugs and Psychotropic Substances",
     mk: "Закон за контрола на опојни дроги и психотропни супстанции",
     avoid: "„…на опојните дроги и психотропните супстанции“",
     lint: ['контрола на опојните дроги']}
  - {en: "Ministry of Interior Affairs (MoIA)", mk: "Министерство за внатрешни работи (МВР)",
     avoid: "MoIA inside the Macedonian text"}
  - {en: "Ministry of Health (MoH)", mk: "Министерство за здравство (МЗ)",
     avoid: "MoH inside the Macedonian text"}
  - {en: "Police escort / escort officer", mk: "полициско придружување / придружник", avoid: "ескорт",
     lint: ['ескорт']}
  - {en: "Carrier", mk: "превозник"}
  - {en: "Consignor / consignee", mk: "испраќач / примач"}
  - {en: "Qualified Person", mk: "квалификувано лице (QP)"}
  - {en: "Transport event", mk: "транспортен настан (UTID)"}
  - {en: "Lane", mk: "рута (лента)"}
  - {en: "Itinerary (the escorted route of one transport)", mk: "траса",
     avoid: "рута (that word is the lane, as defined)"}
  - {en: "Pallet, large / small", mk: "палета, голема / мала — G / M in Macedonian, L / S in English",
     avoid: "Г/М; L/S in the Macedonian half"}
  - {en: "Carton", mk: "картон"}
  - {en: "Bag (primary pack)", mk: "кеса / кеси", avoid: "вреќа (kept for waste sacks only)"}
  - {en: "Intermediate (bulk)", mk: "меѓупроизвод (ринфуз)", avoid: "интермедијер, полупроизвод",
     lint: ['интермедијер', 'полупроизвод']}
  - {en: "Stretch film", mk: "стреч-фолија"}
  - {en: "Thermal blanket", mk: "термо-ќебе / термо-ќебиња", avoid: "термичко ќебе, термално ќебе",
     lint: ['терм(?:ичк|алн)\w* ќеб']}
  - {en: "Active / passive temperature control", mk: "активна / пасивна контрола на температура"}
  - {en: "Cooling/heating unit (of the vehicle)", mk: "уред за ладење/греење",
     avoid: "систем за ладење, „уредот“ alone"}
  - {en: "Single-use logger / USB logger", mk: "логер за еднократна употреба / USB логер", avoid: "записувач",
     lint: ['записувач']}
  - {en: "Logger ID", mk: "ID на логерот", avoid: "сериски број на логерот",
     lint: ['сериск\w* бро\w* на логер']}
  - {en: "Temperature excursion", mk: "температурна екскурзија",
     avoid: "отстапување (that word is reserved for a deviation)"}
  - {en: "Deviation", mk: "отстапување", avoid: "девијација",
     lint: ['(?<!стандардна )(?<!стандардни )(?<!стандардната )девијациј']}
  - {en: "Standard deviation", mk: "стандардна девијација"}
  - {en: "Tamper-evident seal", mk: "пломба со доказ за отворање"}
  - {en: "Chain of custody", mk: "ланец на надзор"}
  - {en: "Packing list", mk: "листа на пакување"}
  - {en: "Retention samples", mk: "ретенциони мостри", avoid: "ретенциони примероци",
     lint: ['ретенцион\w* примерок', 'ретенцион\w* примероц']}
  - {en: "Counter samples (for the buyer and the retailer)", mk: "контра мостри",
     avoid: "контра-мостри, контрамостри", lint: ['контра-мостр', 'контрамостр']}
  - {en: "Annex / attachment", mk: "анекс / прилог", avoid: "прилог meaning an annex"}
  - {en: "SOP", mk: "СОП in the Macedonian text, SOP in the English text"}
  - {en: "Conforms", mk: "Одговара", avoid: "Усогласено as a result"}
  - {en: "Method", mk: "метод", avoid: "метода", lint: ['метода(?:та)?\b']}

rules:
  - "Decimals: comma in Macedonian (388,97 g), point in English (388.97 g)."
  - "Abbreviations are not translated: GMP, GDP, QA, QC, QP, CAPA, MKT, RH, CoA, TRA, UTID."
  - "One term per concept in the whole document, in both halves; a defined term is used exactly as defined."
