# God's Eye View (github.com/bilawalsidhu/gods-eye-view) on KVM4.
# Stack dir on the host: /opt/stacks/gods-eye-view   (src/ = git clone of upstream, pinned by deploy.sh)
# Upstream's Dockerfile is the whole app (Vite dev server + API proxies, port 4173); nothing else to run.
# Not published on a host port: only Traefik reaches it, behind basic auth, because the server
# brokers whatever provider keys are in .env to anyone who can reach it (upstream README, SECURITY.md).
services:
  gods-eye-view:
    build:
      context: ./src
    image: gods-eye-view:local
    container_name: gods-eye-view
    restart: unless-stopped
    user: "1000:1000"                      # src/ is chowned to this by deploy.sh
    environment:
      - GEV_ALLOWED_HOSTS=${GEV_HOST}      # upstream rejects unknown Host headers
      - GEV_KEY_SETUP_TRUSTED_PEERS=none   # Provider Settings UI stays off behind the proxy; keys go in src/.env
    env_file:
      - path: ./src/.env                   # API keys (OPENAI_API_KEY, AISSTREAM_API_KEY, ...); optional
        required: false
    volumes:
      - ./src:/app
      - /app/node_modules                  # keep the image's Linux-built node_modules
    networks: [traefik_network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.gev.rule=Host(`${GEV_HOST}`)
      - traefik.http.routers.gev.entrypoints=websecure
      - traefik.http.routers.gev.tls.certresolver=letsencrypt
      - traefik.http.routers.gev.middlewares=gev-auth
      - traefik.http.middlewares.gev-auth.basicauth.users=${GEV_BASICAUTH}
      - traefik.http.services.gev.loadbalancer.server.port=4173
networks:
  traefik_network:
    external: true
