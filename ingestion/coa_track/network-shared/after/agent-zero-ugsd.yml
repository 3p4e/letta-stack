services:
  agent-zero:
    image: agent0ai/agent-zero:latest
    restart: unless-stopped
    environment:
      AUTH_LOGIN: ${AUTH_LOGIN}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      QDRANT_URL: http://72.60.35.12:6333
      GOTENBERG_URL: http://72.60.35.12:3000
      LETTA_BASE_URL: http://letta:8283
      VOYAGEAI_API_KEY: ${VOYAGE_API_KEY}
      GOOGLE_CLIENT_ID: 634543809372-h2cj3s3mivdircmih70c6vf0hg07tmo2.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
    - '80'
    labels:
    - traefik.enable=true
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
    - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
    - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
    volumes:
    - agent-zero-data:/a0/usr
    networks:
    - letta_stack
    - shared
volumes:
  agent-zero-data: null
networks:
  letta_stack:
    external: true
    name: letta_letta_stack
  shared:
    external: true
