<!doctype html><html><head><meta charset="utf-8"><title>PP Document Engine — Features</title>
<style>body{font-family:Calibri,Segoe UI,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#1d2a33}
h1{font-size:20px;color:#2B547E}.f{border:1px solid #d6dde2;border-radius:6px;padding:10px 12px;margin:8px 0;display:flex;gap:12px;align-items:center}
.f div{flex:1}.f small{color:#666;display:block}button{background:#2B547E;color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer;margin-right:6px}
input[type=number]{width:70px}code{background:#f1f3f5;padding:1px 4px}</style></head><body>
<h1>PP Document Engine — feature switches</h1>
<p>Turn features on or off, then <b>Save</b>: the browser downloads <code>pp_features.json</code>. Put it in <code>pp-document-suite/assets/</code> (all builds) or point <code>PP_FEATURES</code> at it (one run). A single document can still override with <code>features: limit_bars=off</code> in its HEADERDATA.</p>
<input type="file" id="load" accept=".json"> <div id="list"></div>
<button onclick="save()">Save pp_features.json</button><button onclick="reset()">Defaults</button>
<script>
const DEF={"limit_bars":{"on":true,"label":"Limit bars","help":"[[LIMITS]] blocks: value + colour bar against its acceptance limit in each cell"},
"limit_bars_legend":{"on":true,"label":"Limit bar legend","help":"Print the bilingual legend under a [[LIMITS]] table"},
"limit_bars_amber_at":{"value":0.75,"label":"Amber threshold","help":"Fraction of the limit (bar length) above which a bar turns amber"},
"figures":{"on":true,"label":"Figures","help":"[[FIGURE:path|width_mm]] places an image (chart, scan) in the document"}};
let F=JSON.parse(JSON.stringify(DEF));
function draw(){const L=document.getElementById('list');L.innerHTML='';for(const[k,v]of Object.entries(F)){if(k[0]=='_')continue;
const d=document.createElement('div');d.className='f';const c='value'in v?`<input type=number step=0.05 min=0 max=1 value="${v.value}" onchange="F['${k}'].value=+this.value">`:`<input type=checkbox ${v.on?'checked':''} onchange="F['${k}'].on=this.checked">`;
d.innerHTML=`${c}<div><b>${v.label||k}</b> <code>${k}</code><small>${v.help||''}</small></div>`;L.appendChild(d)}}
function save(){const b=new Blob([JSON.stringify(Object.assign({"_doc":"Feature switches for build_from_md.py (see pp_features_dashboard.html)."},F),null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pp_features.json';a.click()}
function reset(){F=JSON.parse(JSON.stringify(DEF));draw()}
document.getElementById('load').onchange=e=>{const r=new FileReader();r.onload=()=>{const j=JSON.parse(r.result);for(const k in j)if(k[0]!='_')F[k]=Object.assign(F[k]||{},j[k]);draw()};r.readAsText(e.target.files[0])};
draw();
</script></body></html>
