# Add the Purely Plant Document Suite as a dedicated container inside the Letta stack.
#
#   LETTA_NETWORK=<your letta compose network>  docker compose -f docker-compose.letta.yml up -d --build
#
# `docker network ls` shows the Letta stack's network name (often "<project>_default").
# Once up, Letta agents reach the service at http://pp-document-suite:8600 — register the REST tool
# (integrations/letta_register.py, LETTA_MODE=rest, QMS_API_BASE=http://pp-document-suite:8600).
services:
  pp-document-suite:
    build: .
    image: pp-document-suite:1.6.2
    container_name: pp-document-suite
    restart: unless-stopped
    environment:
      - PP_SUITE_DIR=/opt/pp-document-suite
      - PP_OUT_DIR=/data
    volumes:
      - pp_suite_out:/data           # generated .docx/.pdf persist here
    networks: [letta]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8600/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # This service has NO authentication on /build, /build.docx or /build.pdf
      # — they accept arbitrary Markdown and shell out to soffice. That is
      # tolerable only because it publishes no ports and is reachable solely
      # from inside the `letta` network. Declaring traefik.enable=false makes
      # that explicit rather than incidental, so a future Traefik reconfiguration
      # cannot pick it up by accident. Same guard the backing services use
      # (network-shared/after/gotenberg.yml, after/qdrant.yml).
      #
      # Do NOT simply flip this to true: the routes must be gated first. That is
      # a coordinated change, because the suite has registered Letta REST tools
      # (integrations/letta_register.py, pp_tool.py) that would each need the
      # key before an auth requirement could land.
      - traefik.enable=false
    # Optional external HTTPS route via Traefik — ONLY after the /build* routes
    # are authenticated (see above). Uncomment, set your host, and note the
    # entrypoints/certresolver pair the house pattern requires:
    #   - traefik.enable=true
    #   - traefik.http.routers.ppsuite.rule=Host(`ppsuite.srv1231216.hstgr.cloud`)
    #   - traefik.http.routers.ppsuite.entrypoints=websecure
    #   - traefik.http.routers.ppsuite.tls.certresolver=letsencrypt
    #   - traefik.http.services.ppsuite.loadbalancer.server.port=8600

networks:
  letta:
    external: true
    name: ${LETTA_NETWORK:-letta_default}

volumes:
  pp_suite_out:
